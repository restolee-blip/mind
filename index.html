<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>감정 이모티콘 생성기 (최종)</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

<style>
body {text-align:center;font-family:sans-serif;background:#fff7fa;}
button {margin:5px;padding:10px;border-radius:15px;border:none;background:#ffd1dc;}
canvas,video {border-radius:20px;margin-top:10px;}
</style>
</head>

<body>

<h2>😊 감정 이모티콘 생성기</h2>

<video id="video" autoplay playsinline width="240"></video>
<canvas id="canvas" width="240" height="240"></canvas>

<br>

<button onclick="setEmotion('😊')">😊</button>
<button onclick="setEmotion('😢')">😢</button>
<button onclick="setEmotion('😡')">😡</button>
<button onclick="setEmotion('😴')">😴</button>

<br><br>

<button onclick="exportPNGSet()">📦 PNG 24개</button>
<button onclick="exportGIF()">🎞 GIF</button>
<button onclick="generateThumbnail()">🖼 썸네일</button>

<script>

// 🎯 감정
let currentEmotion = "😊";

// 🎥 카메라
const video = document.getElementById("video");
navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>video.srcObject=stream);

// 🧠 FaceMesh
const faceMesh = new FaceMesh({
 locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});
faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true});

// 🎨 얼굴 변형
function distort(ctx, video, lm){

 const m = lm[13];
 const x = m.x * 240;
 const y = m.y * 240;

 ctx.save();

 if(currentEmotion==="😊"){
  ctx.translate(x,y);
  ctx.scale(1.3,1.1);
  ctx.translate(-x,-y);
 }

 if(currentEmotion==="😢"){
  ctx.translate(0,10);
 }

 if(currentEmotion==="😡"){
  ctx.translate(Math.random()*5,0);
 }

 if(currentEmotion==="😴"){
  ctx.scale(0.9,0.9);
 }

 ctx.drawImage(video,0,0,240,240);
 ctx.restore();
}

// 🎞 렌더링
faceMesh.onResults(r=>{
 const canvas=document.getElementById("canvas");
 const ctx=canvas.getContext("2d");

 ctx.clearRect(0,0,240,240);

 if(r.multiFaceLandmarks.length){
  distort(ctx, video, r.multiFaceLandmarks[0]);
 } else {
  ctx.drawImage(video,0,0,240,240);
 }
});

function loop(){
 faceMesh.send({image:video});
 requestAnimationFrame(loop);
}
video.onloadeddata=loop;

// 🎯 감정 선택
function setEmotion(e){ currentEmotion=e; }

// 🎨 배경 제거
function removeBG(ctx){
 const img=ctx.getImageData(0,0,240,240);
 const d=img.data;

 for(let i=0;i<d.length;i+=4){
  if(d[i]>240 && d[i+1]>240 && d[i+2]>240){
   d[i+3]=0;
  }
 }

 ctx.putImageData(img,0,0);
}

// 📦 PNG 24개 — 감정별로 순서대로 캡처
const EMO = ["😊","😢","😡","😴","😍","😮","😆","😐",
"🥰","😭","😤","😪","😎","😳","😇","😜",
"🤔","😬","😱","😋","🤩","😒","😔","😝"];

function exportPNGSet(){
 const canvas=document.getElementById("canvas");
 const ctx=canvas.getContext("2d");

 EMO.forEach((e,i)=>{
  // currentEmotion을 setTimeout 안에서 설정해야 클로저 버그 없음
  setTimeout(()=>{
   currentEmotion=e;
   // FaceMesh가 새 감정으로 렌더링할 시간을 준 뒤 캡처
   setTimeout(()=>{
    removeBG(ctx);
    const a=document.createElement("a");
    a.href=canvas.toDataURL("image/png");
    a.download=`emoji_${i+1}.png`;
    a.click();
   }, 100);
  }, i*300);
 });
}

// 🎞 GIF
function exportGIF(){

 const canvas=document.getElementById("canvas");

 const gif=new GIF({workers:2,quality:5});

 let f=0;

 const cap=setInterval(()=>{
  gif.addFrame(canvas,{copy:true,delay:80});
  f++;

  if(f>20){
   clearInterval(cap);

   gif.on('finished',b=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download="emotion.gif";
    a.click();
   });

   gif.render();
  }
 },80);
}

// 🖼 썸네일
function generateThumbnail(){

 const canvas=document.getElementById("canvas");
 const ctx=canvas.getContext("2d");

 ctx.clearRect(0,0,240,240);
 ctx.drawImage(video,20,20,200,200);

 removeBG(ctx);

 const a=document.createElement("a");
 a.href=canvas.toDataURL("image/png");
 a.download="thumbnail.png";
 a.click();
}

</script>

</body>
</html>
