<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>감정 이모티콘 생성기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
body {text-align:center;font-family:sans-serif;background:#fff7fa;margin:0;padding:10px;}
h2 {margin:10px 0;}
#status {color:#888;font-size:13px;margin:4px 0 8px;}
button {margin:3px;padding:8px 10px;border-radius:15px;border:none;background:#ffd1dc;font-size:18px;cursor:pointer;}
button.active {outline:3px solid #ff69b4;background:#ffb3c6;}
#emoGrid {display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:380px;margin:8px auto;}
#actionBtns button {font-size:14px;padding:10px 16px;}
canvas {border-radius:20px;display:block;margin:8px auto 0;}
video {display:none;}
</style>
</head>
<body>

<h2>😊 감정 이모티콘 생성기</h2>
<p id="status">카메라 연결 중...</p>

<!-- video는 숨기고 canvas만 표시 -->
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" width="320" height="320"></canvas>

<div id="emoGrid"></div>

<br>
<div id="actionBtns">
  <button onclick="takePhoto()">📸 사진 찍기</button>
  <button onclick="exportPNGSet()">📦 PNG 24개</button>
  <button onclick="exportGIF()">🎞 GIF</button>
</div>

<script>
const EMO = [
  "😊","😢","😡","😴","😍","😮","😆","😐",
  "🥰","😭","😤","😪","😎","😳","😇","😜",
  "🤔","😬","😱","😋","🤩","😒","😔","😝"
];

const EFFECTS = {
  "😊": {filter:"brightness(1.1) saturate(1.6)", sx:1.08, sy:1.06},
  "😢": {filter:"brightness(0.75) saturate(0.4) hue-rotate(200deg)", dy:12},
  "😡": {filter:"brightness(1.1) saturate(2.5) hue-rotate(340deg)", shake:true},
  "😴": {filter:"brightness(0.65) saturate(0.3) blur(1.5px)", sx:0.93, sy:0.9},
  "😍": {filter:"brightness(1.2) saturate(2.2) hue-rotate(-20deg)", sx:1.12, sy:1.12},
  "😮": {filter:"brightness(1.05) contrast(1.3)", sy:1.15},
  "😆": {filter:"brightness(1.2) saturate(1.8)", sx:1.15},
  "😐": {filter:"saturate(0.5) brightness(0.92)"},
  "🥰": {filter:"brightness(1.15) saturate(2.4) hue-rotate(-15deg)", sx:1.1, sy:1.1},
  "😭": {filter:"brightness(0.65) saturate(0.3) hue-rotate(215deg)", dy:18},
  "😤": {filter:"brightness(1.05) saturate(2.2) contrast(1.3)"},
  "😪": {filter:"brightness(0.7) saturate(0.4) blur(0.8px)", sy:0.88},
  "😎": {filter:"brightness(0.9) contrast(1.5) saturate(1.1)"},
  "😳": {filter:"brightness(1.25) saturate(1.9) hue-rotate(-30deg)", sx:1.12, sy:1.12},
  "😇": {filter:"brightness(1.35) saturate(0.7)"},
  "😜": {filter:"brightness(1.1) saturate(1.6)", rotate:6},
  "🤔": {filter:"brightness(0.95) saturate(0.85)", rotate:-4},
  "😬": {filter:"brightness(1.05) contrast(1.4) saturate(0.75)", sx:1.22, sy:0.88},
  "😱": {filter:"brightness(1.1) contrast(1.6) saturate(0.45)", sx:1.2, sy:1.3},
  "😋": {filter:"brightness(1.12) saturate(1.7)", sx:1.06, sy:1.06},
  "🤩": {filter:"brightness(1.35) saturate(3.0)", sx:1.2, sy:1.2},
  "😒": {filter:"brightness(0.88) saturate(0.55)", dy:6},
  "😔": {filter:"brightness(0.72) saturate(0.4)", dy:12},
  "😝": {filter:"brightness(1.15) saturate(1.9) hue-rotate(15deg)", sx:1.1, sy:0.93},
};

let currentEmotion = "😊";
let cameraReady = false;

// ── 감정 버튼 24개 동적 생성 ──────────────────────
const grid = document.getElementById("emoGrid");
EMO.forEach(e => {
  const btn = document.createElement("button");
  btn.textContent = e;
  btn.dataset.emo = e;
  if (e === "😊") btn.classList.add("active");
  btn.onclick = () => setEmotion(e);
  grid.appendChild(btn);
});

function setEmotion(e) {
  currentEmotion = e;
  document.querySelectorAll("#emoGrid button").forEach(b =>
    b.classList.toggle("active", b.dataset.emo === e));
}

// ── 카메라 연결 ───────────────────────────────────
const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({video:{width:320,height:320,facingMode:"user"}, audio:false})
  .then(stream => {
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      cameraReady = true;
      document.getElementById("status").textContent = "카메라 연결됨 ✓";
      requestAnimationFrame(renderLoop);
    };
  })
  .catch(err => {
    document.getElementById("status").textContent = "카메라 오류: " + err.message;
  });

// ── 캔버스 렌더링 ─────────────────────────────────
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// 감정 효과를 적용해 targetCtx에 그리기
function drawWithEffect(targetCtx, w, h) {
  const eff = EFFECTS[currentEmotion] || {};
  const cx = w / 2, cy = h / 2;

  targetCtx.save();
  targetCtx.filter = eff.filter || "none";
  targetCtx.translate(cx, cy);
  if (eff.rotate) targetCtx.rotate(eff.rotate * Math.PI / 180);
  targetCtx.scale(eff.sx || 1, eff.sy || 1);
  const dx = eff.shake ? (Math.random() - 0.5) * 8 : 0;
  targetCtx.translate(-cx + dx, -cy + (eff.dy || 0)); // -cy + dy (부호 수정)
  targetCtx.drawImage(video, 0, 0, w, h);
  targetCtx.restore();
  targetCtx.filter = "none";
}

// video → canvas 직접 렌더 루프 (FaceMesh 불필요)
function renderLoop() {
  if (video.readyState >= 2) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawWithEffect(ctx, canvas.width, canvas.height);
  }
  requestAnimationFrame(renderLoop);
}

// ── 다운로드 헬퍼 ─────────────────────────────────
function download(dataURL, filename) {
  const a = document.createElement("a");
  a.href = dataURL;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ── 📸 사진 찍기 ──────────────────────────────────
function takePhoto() {
  if (!cameraReady || video.readyState < 2) {
    alert("카메라가 준비되지 않았습니다.");
    return;
  }
  // canvas는 매 프레임 갱신 중이므로 현재 상태를 바로 저장
  download(canvas.toDataURL("image/png"), `photo_${currentEmotion}.png`);
}

// ── 📦 PNG 24개 ───────────────────────────────────
function exportPNGSet() {
  if (!cameraReady) { alert("카메라가 준비되지 않았습니다."); return; }
  const saved = currentEmotion;
  EMO.forEach((e, i) => {
    setTimeout(() => {
      setEmotion(e);
      setTimeout(() => {
        download(canvas.toDataURL("image/png"),
          `emoji_${String(i+1).padStart(2,"0")}_${e}.png`);
        if (i === EMO.length - 1) setEmotion(saved);
      }, 150);
    }, i * 400);
  });
}

// ── 🎞 GIF ────────────────────────────────────────
function exportGIF() {
  if (!cameraReady) { alert("카메라가 준비되지 않았습니다."); return; }
  if (typeof GIF === "undefined") { alert("GIF 라이브러리를 불러오지 못했습니다."); return; }
  const gif = new GIF({workers:2, quality:5, width:canvas.width, height:canvas.height});
  let f = 0;
  const cap = setInterval(() => {
    gif.addFrame(canvas, {copy:true, delay:80});
    if (++f >= 20) {
      clearInterval(cap);
      gif.on("finished", b => download(URL.createObjectURL(b), "emotion.gif"));
      gif.render();
    }
  }, 80);
}
</script>
</body>
</html>
